[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/9aia/cicada"
license = "MIT"

[workspace.dependencies]
# Internal crates.
cicada-core = { path = "crates/cicada-core" }
cicada-schema = { path = "crates/cicada-schema" }
cicada-state = { path = "crates/cicada-state" }
cicada-google = { path = "crates/cicada-google" }
cicada-mcp = { path = "crates/cicada-mcp" }
cicada-shell = { path = "crates/cicada-shell" }
cicada-testkit = { path = "crates/cicada-testkit" }

# External dependencies — pin conservative majors/minors.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
async-trait = "0.1"
# Time: wall-time + IANA zones in the pure core. jiff 0.2.38 (Oct 2026)
# is >7 days old; floor pinned conservative.
jiff = { version = "0.2.35", features = ["serde"] }
# Content hashes for recorded state / idempotency keys.
sha2 = "0.10"
tokio = { version = "1", features = [
  "signal",
  "macros",
  "rt-multi-thread",
  "io-util",
  "io-std",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
# Field-path context on serde errors (spec.events[0].start), so DSL
# diagnostics point at the offending field instead of raw serde sprawl.
serde_path_to_error = "0.1"
# Advisory file locks for the state store (ADR-0002 §7). fs4 0.13.1
# (Oct 2025) is the mature fs2 successor — rustix-based, owned-guard
# semantics via the File handle.
fs4 = { version = "0.13", features = ["sync"] }
# MCP server transport (ADR-0001 §8a). rmcp is the official MCP Rust
# SDK; ~3.5.1 (Oct 5 2026) pinned conservative — server + stdio only.
rmcp = { version = "~3.5.1", default-features = false, features = [
  "server",
  "transport-io",
] }
# HTTP client for the Google adapter (Http port impl). reqwest 0.12.28
# (Dec 2025) is >7 days old; rustls with the ring provider + platform
# roots keeps the build C-free (no aws-lc-rs/cmake).
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
  "http2",
  "system-proxy",
] }
# Service-account JWT (RS256) for Google auth. jsonwebtoken 10.4
# (May 2026) is >7 days old; rust_crypto is the pure-Rust backend.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
# URL building/query encoding for provider adapters.
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Hard gates: deny classes that hide real bugs.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# Warn-level signal, fixed as we go.
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints that cost more than they catch here.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
struct_excessive_bools = "allow"

[profile.dev]
# Line tables only: backtraces still symbolize, but test-binary links
# and disk usage drop sharply.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false # dependencies don't need debuginfo

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release]
# Thin LTO for local `cargo xtask install` — shipped binaries go
# through `cargo build --profile dist` (release.yml).
lto = "thin"
strip = true
panic = "unwind" # keep unwind: tests + tokio supervise panics

[profile.dist]
# What we ship: maximum optimization, one codegen unit.
inherits = "release"
lto = "fat"
codegen-units = 1
