# cicada release config — org release conventions inlined (ADR-0004/0005)
# so repos don't depend on an installed profile pack. Tag-only:
# crates.io is tamias-only and GitHub Releases are unused — after
# tagging, ship the repo's tamias pack manually
# (`tamias publish libraries/cicada`).
#
# Units default to cargo workspace members; crates carry per-crate
# versions (no workspace-inherited version), so units bump
# independently.

[release]
styleguide = "keep-a-changelog"
changelog_path = "CHANGELOG.md"
diff_exclude = ["docs/**", "project/**", "*.md", ".github/**"]
tag_format = "{unit}-v{version}"

[release.unit_overrides.xtask]
skip = true

# Pack-ref sync (T-039): the `cicada` pack manifest version + README
# install ref are rewritten to the new version inside the release
# commit. NOTE: crates carry per-crate versions, so a mixed-version
# plan skips the stage (single old→new pair required) — the pack
# version tracks the `cicada` unit (crates/cicada-cli).
[release.sync_refs]
rules = [
  { files = ["libraries/cicada/tamias.yaml"], find = "(?m)^version: \"{old}\"", replace = "version: \"{new}\"" },
  { files = ["README.md"], find = "cicada@{old}", replace = "cicada@{new}" },
]

[publish.crates]
enabled = false   # ADR-0004: crates.io publishing is tamias-only

[publish.ghreleases]
enabled = false   # org releases are tag-only; capability stays for opt-in
