[package]
name = "cicada"
description = "cicada — calendars as code: the engine lib + `cicada` CLI (init/validate/plan/apply/refresh/drift/range/show/fmt/provider/mcp)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# No [[bin]] — the `cicada` command ships as the tamias pack in
# `libraries/cicada/` (T-012): a generated `bins[]` shim →
# `tamias-driver-cicada cli` → `cicada::run_from` in-process.
# Engine e2e tests live in `crates/cicada-driver/tests/` and spawn
# `tamias-driver-cicada run`.

[dependencies]
cicada-core.workspace = true
cicada-schema.workspace = true
cicada-state.workspace = true
cicada-google.workspace = true
cicada-mcp.workspace = true
cicada-shell.workspace = true
cicada-testkit.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
url.workspace = true
jiff.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
