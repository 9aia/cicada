[package]
name = "cicada-driver"
description = "tamias-driver-cicada — pavo engine-ops driver over the `cicada` CLI plus tamias content driver for `type: cicada` packages"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tamias-driver-cicada"
path = "src/main.rs"

[features]
# Embedded surface (pavo-driver-kit's surface layer) — optional,
# acyclic: the driver gains an `mcp` argv verb that serves its own
# ops manifest as MCP tools. There is no `cli` feature: `cli` is
# the tamias `bins[]` shim passthrough verb (always on — it runs
# the engine's own argv grammar, which a generated surface can't
# express). default = ops driver + `run`/`cli` passthroughs + the
# tamias content-type verbs only.
default = []
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
cicada-core.workspace = true
cicada-schema.workspace = true
cicada-state.workspace = true
cicada-shell.workspace = true
# The engine lib — `ops` manifest derives from `cicada::command()`
# and `run`/`cli.*`/surfaces re-exec through `cicada::run_from`.
cicada.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
# The public wire contract — git dep so `cargo install --git` and
# fresh-clone resolution work without a sibling ../pavo checkout
# (path deps break workspace resolution). `version` is the
# crates.io fallback once pavo-protocol publishes. `rev` pins the
# surface-driver layer (`pavo_driver_kit::surface`) the `cli`/`mcp`
# features and ops-manifest contract need.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0", rev = "1f5e37afdb0b66a1ef908c2cc2448248493399c2" }
# Driver-authoring kit — serve loop, manifest builders, and the
# `surface` layer (ops manifest → generated CLI + MCP). Same
# git-dep rule as pavo-protocol above.
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0", rev = "1f5e37afdb0b66a1ef908c2cc2448248493399c2" }

[dev-dependencies]
tempfile.workspace = true
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-cicada serve` binary.
pavo-testkit = { git = "https://github.com/9aia/pavo", rev = "1f5e37afdb0b66a1ef908c2cc2448248493399c2" }

[lints]
workspace = true
